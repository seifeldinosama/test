name: Build & Test Docker
on:
  push:
    branches: [ "main" ]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build image
        run: docker build -t simple-python-service .
      - name: Run container
        run: |
          docker run -d -p 5000:5000 --name test-container simple-python-service
          sleep 5
          curl -f http://localhost:5000/health
          docker logs test-container
          docker stop test-container
